language: "bash"
layer: "automation"

tasks:
  validate:
    command: "ci/validate-automation.sh"
    inputs:
      - "**/*"
      - "/.github/workflows/*.yml"
      - "/.moon/**/*.yml"
      - "/.prototools"
      - "/.release-please-manifest.json"
      - "/Cargo.toml"
      - "/flake.lock"
      - "/flake.nix"
      - "/release-please-config.json"
      - "/version.txt"
    options:
      cache: false
      runInCI: "affected"

  graphifyBuild:
    command: "$workspaceRoot/scripts/dev/graphify-build.sh"
    description: "Build the PolyGlid codebase knowledge graph with graphify-rs"
    options:
      cache: false
      runInCI: "skip"

  graphifyQuery:
    command: "$workspaceRoot/scripts/dev/graphify-query.sh"
    description: "Query the PolyGlid knowledge graph"
    options:
      cache: false
      runInCI: "skip"

  graphifyServe:
    command: "$workspaceRoot/scripts/dev/graphify-serve.sh"
    description: "Serve the PolyGlid knowledge graph over MCP for agents"
    options:
      cache: false
      runInCI: "skip"
      persistent: true
